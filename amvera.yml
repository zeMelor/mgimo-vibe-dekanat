# Конфигурация хостинга Amvera (amvera.ru): Python 3.11, зависимости из requirements.txt.
# База SQLite лежит в постоянном томе /data и переживает перезапуски.
meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 80
  persistenceMount: /data
  containerPort: 80
