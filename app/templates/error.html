{% extends "base.html" %}
{% from "macros.html" import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="error-page">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ text }}</p>
  <a class="btn btn-primary" href="/">{{ icon("home") }}На главную</a>
</section>
{% endblock %}
{% block guest %}
<main class="login">
  <section class="login-card error-page">
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ text }}</p>
    <a class="btn btn-primary" href="/login">Ко входу</a>
  </section>
</main>
{% endblock %}
